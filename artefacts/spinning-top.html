<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spinning top — artefact harness</title>
<style>
  :root { --bg: #15161a; --panel: #23252a; --text: #e4e6e9; --muted: #8b9098; --accent: #d9a33c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1100px 620px at 50% 18%, #2a2d34 0%, #1d1f24 45%, var(--bg) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 56px 24px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  p.sub { margin: 0 0 28px; color: var(--muted); font-size: 13.5px; text-align: center; max-width: 560px; line-height: 1.5; }
  .controls { display: flex; gap: 12px; margin-bottom: 8px; }
  button {
    appearance: none; border: 1px solid #45484f; background: var(--panel); color: var(--text);
    font-size: 13.5px; font-weight: 500; padding: 10px 20px; border-radius: 999px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: linear-gradient(180deg, #e7b755, var(--accent)); border-color: #e7b755; color: #2a1d06; }
  .state { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); height: 18px; }
  .row { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
</style>
</head>
<body>

<h1>Spinning top — artefact harness</h1>
<p class="sub">The artefact renders and animates itself; the buttons below are ordinary page
controls calling <code>top.fall()</code> and <code>top.reset()</code> on it. The row underneath is
six instances sharing one animation loop, each falling on its own cue.</p>

<div class="controls">
  <button class="primary" id="fall">Fall</button>
  <button id="reset">Reset</button>
</div>
<div class="state" id="state"></div>
<div id="single"></div>

<div class="controls" style="margin-top:24px">
  <button id="fallRow">Fall, one after another</button>
  <button id="resetRow">Reset all</button>
</div>
<div class="row" id="row"></div>

<script type="module">
  import { createSpinningTop } from "./spinning-top.js";

  const top = createSpinningTop({
    size: 300,
    onRest: () => { label.textContent = "state: rest"; },
  });
  document.getElementById("single").appendChild(top.el);

  const label = document.getElementById("state");
  document.getElementById("fall").addEventListener("click", () => {
    top.fall();
    label.textContent = `state: ${top.state}`;
  });
  document.getElementById("reset").addEventListener("click", () => {
    top.reset();
    label.textContent = `state: ${top.state}`;
  });

  const row = document.getElementById("row");
  const many = Array.from({ length: 6 }, (_, i) => {
    const t = createSpinningTop({ size: 130, seed: i / 6, table: false });
    row.appendChild(t.el);
    return t;
  });

  document.getElementById("fallRow").addEventListener("click", () => {
    many.forEach((t, i) => setTimeout(() => t.fall(), i * 700));
  });
  document.getElementById("resetRow").addEventListener("click", () => {
    many.forEach((t) => t.reset());
  });
</script>

</body>
</html>
